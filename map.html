<script>
const DATA = {"dams": [{"lat": 43.8302, "lon": -70.455, "name": "Eel Weir Dam", "status": "barrier", "town": "Standish / Windham", "rm": "~25.8", "owner": "Presumpscot Hydro LLC (Dichotomy Power)", "built": "power dam 1903 (some sources 1879)", "removed": "", "cap": "1.8 MW (3 × 600 kW)", "ferc": "P-2984", "note": "The river's first barrier — the control dam at the outlet of Sebago Lake. It sets the level of the lake, which is also greater Portland's drinking-water supply, so its gates govern flow for the whole river below.", "anad": "None required; Maine DEP reserves the right. Landlocked-salmon passage was declined.", "anadLevel": "none", "eelUp": "Upstream eelway — required by the 2015 FERC license, built ~2017", "eelDown": "Downstream eel passage at the dam base — required by the 2015 license", "srcs": [["2015 FERC license & water-quality certificate", "https://lowimpacthydro.org/wp-content/uploads/2020/12/2015-Eel-Weir-ME-FERC-License-and-WQC.pdf"]]}, {"lat": 43.8091, "lon": -70.4546, "name": "North Gorham Dam", "status": "barrier", "town": "Gorham / Windham / Standish", "rm": "23.6", "owner": "Brookfield White Pine Hydro LLC", "built": "1915 (operating 1925)", "removed": "", "cap": "2.25 MW", "ferc": "P-2519", "note": "Impounds North Gorham Pond. The only Presumpscot hydro project not once owned by the paper company — it is held by Brookfield rather than the former Sappi group.", "anad": "None required yet; agencies reserve the right to require it.", "anadLevel": "none", "eelUp": "Eelway installed 2020–21 (operates ~Jun 1–Sep 15); ~1,301 eels passed in 2023, ~1,811 in 2024", "eelDown": "Fall nighttime shutdowns (~8 weeks, 8 hrs/night)", "srcs": [["LIHI Certificate No. 129", "https://lowimpacthydro.org/lihi-certificate-129-north-gorham-project-maine/"]]}, {"lat": 43.7793, "lon": -70.454, "name": "Dundee Dam", "status": "barrier", "town": "Windham / Gorham", "rm": "~20.5", "owner": "Presumpscot Hydro LLC (Dichotomy Power)", "built": "1913", "removed": "", "cap": "2.4 MW (3 × 800 kW)", "ferc": "P-2942", "note": "The largest impoundment on the river. Under the 2019 settlement that freed Saccarappa, the two uppermost mill dams (Dundee and Gambo) were relieved of the obligation to pass sea-run fish, since barriers below them remain.", "anad": "None built. Section 18 fishway prescription eliminated (2019 settlement); conditional on later 'Phase II' triggers above Gambo.", "anadLevel": "none", "eelUp": "Upstream eel ramp/lift completed Aug 12, 2007 (entrance improved after a 2014 study)", "eelDown": "Turbine shutdown Sept 1–Oct 31, ≥8 hrs from sunset", "srcs": [["FERC Final EA (P-2897 et al.)", "https://www.ferc.gov/sites/default/files/2020-06/P-2897-048-et-al-FinalEA.pdf"], ["LIHI application — Dundee (P-2942)", "https://lowimpacthydro.org/wp-content/uploads/2020/07/20170901_P2942_-Dundee_LIHI-Application_Filing-Copy.pdf"]]}, {"lat": 43.7556, "lon": -70.4386, "name": "Gambo Dam", "status": "barrier", "town": "Windham / Gorham", "rm": "18.6", "owner": "Presumpscot Hydro LLC (Dichotomy Power)", "built": "1912 (Oriental Powder Mills site)", "removed": "", "cap": "1.9 MW (2 × 950 kW)", "ferc": "P-2931", "note": "Built in 1912 on the site of the Oriental Powder Company's gunpowder works, which supplied the Union Army in the Civil War. The falls here mark the old Gorham–Windham town line.", "anad": "Requirement eliminated (2019 license amendment).", "anadLevel": "none", "eelUp": "Upstream eel passage installed 2007 (since improved; tested 2023)", "eelDown": "Turbine shutdown Sept 1–Oct 31, 8 hrs from sunset", "srcs": [["LIHI Certificate No. 139", "https://lowimpacthydro.org/lihi-certificate-139-gambo-hydroelectric-project-maine/"]]}, {"lat": 43.73416, "lon": -70.42466, "name": "Little Falls Dam", "status": "barrier", "town": "Windham / Gorham", "rm": "16.9", "owner": "Presumpscot Hydro LLC (Dichotomy Power)", "built": "early 20th c. (mill site from 1700s)", "removed": "", "cap": "1.0 MW (4 × 250 kW)", "ferc": "P-2941", "note": "One of the smaller run-of-river dams. Its nightly autumn shutdowns (Sept–Oct) let migrating American eels move downstream past the turbines.", "anad": "Conditional — not built; agencies retain the right if biological triggers are met.", "anadLevel": "deferred", "eelUp": "Upstream eel passage installed 2007 (updated)", "eelDown": "Turbine shutdown Sept 1–Oct 31, 8 hrs from sunset (tested 2024–25)", "srcs": [["LIHI Certificate No. 140", "https://lowimpacthydro.org/lihi-certificate-140-little-falls-hydroelectric-project-maine/"]]}, {"lat": 43.72743, "lon": -70.42, "name": "Mallison Falls Dam", "status": "barrier", "town": "Windham / Gorham", "rm": "~15.5", "owner": "Presumpscot Hydro LLC (Dichotomy Power)", "built": "1900 (developed for hydroelectric power)", "removed": "", "cap": "0.8 MW (2 × 400 kW)", "ferc": "P-2932", "note": "The smallest of the standing hydro dams. Together with Little Falls it sits just above the head of the reach that Saccarappa's removal reopened to river herring and shad.", "anad": "Deferred — timing tied to the Saccarappa fishway effectiveness studies.", "anadLevel": "deferred", "eelUp": "Upstream eel passage installed 2006; eel-ramp extension added 2022", "eelDown": "Turbine shutdown Sept 1–Oct 31, 8 hrs from sunset", "srcs": [["FERC Final EA (P-2897 et al.)", "https://www.ferc.gov/sites/default/files/2020-06/P-2897-048-et-al-FinalEA.pdf"]]}, {"lat": 43.67897, "lon": -70.36917, "name": "Saccarappa Dam", "status": "open", "town": "Westbrook (downtown)", "rm": "~11", "owner": "Removed — river restored", "built": "19th-c. mill dam", "removed": "2019 (fishways completed 2021)", "cap": "was 1.35 MW", "ferc": "P-2897 (surrendered)", "note": "After three years of negotiation, Sappi surrendered its license and the dam in downtown Westbrook came out in 2019, with engineered fishways completed in 2021. In its place, nature-like and Denil fishways let sea-run fish climb Saccarappa Falls, opening the longest continuous stretch of spawning habitat on the river.", "anad": "Passes river herring & shad via nature-like fishways + a double Denil fishway at the lower falls.", "anadLevel": "pass", "eelUp": "Open — nature-like fishways at the upper falls", "eelDown": "Open — dam removed", "srcs": [["USFWS — Rallying 'round the Presumpscot", "https://www.fws.gov/story/rallying-round-presumpscot"], ["Friends of the Presumpscot — Saccarappa", "https://www.presumpscotriver.org/sacarappa"]]}, {"lat": 43.68444, "lon": -70.35361, "name": "Cumberland Mills Dam", "status": "barrier", "town": "Westbrook (Sappi mill)", "rm": "~10", "owner": "Sappi North America (mill)", "built": "1896 (concrete dam)", "removed": "", "cap": "0 MW (no generation)", "ferc": "Non-powered (0 MW)", "note": "Now the lowest dam on the Presumpscot. It carries no turbines — it holds water for Sappi's Westbrook paper mill — but it remains the barrier sea-run fish must pass. Below it, about seven miles of river run free to the tide.", "anad": "Denil fish ladder (2013, ~$4.8M) passes river herring, alewife & shad — the run rose from ~810 herring (2017) to 50,000+ (2018).", "anadLevel": "pass", "eelUp": "Eels can ascend the Denil fish ladder (2013)", "eelDown": "No turbines — no turbine mortality for out-migrating eels", "srcs": [["FERC Final EA (P-2897 et al.)", "https://www.ferc.gov/sites/default/files/2020-06/P-2897-048-et-al-FinalEA.pdf"], ["S.D. Warren Paper Mill (site)", "https://en.wikipedia.org/wiki/S._D._Warren_Paper_Mill"]]}, {"lat": 43.7169, "lon": -70.26449, "name": "Smelt Hill Dam", "status": "open", "town": "Falmouth / Portland (Presumpscot Falls)", "rm": "~3", "owner": "Removed — falls restored", "built": "1889 hydro dam (site dammed from the 1730s)", "removed": "2002", "cap": "was hydro (from 1889)", "ferc": "—", "note": "At Presumpscot Falls stood the site of Maine's earliest dam (1730s) and its first hydroelectric plant (1889). Damaged by a 1996 flood, Smelt Hill was removed in 2002 — the first dam removal on the river — restoring the falls, the estuary, and tidal access from Casco Bay.", "anad": "Full passage at Presumpscot Falls; the estuary is reconnected to Casco Bay.", "anadLevel": "open", "eelUp": "Open — dam removed 2002", "eelDown": "Open — dam removed 2002", "srcs": [["USACE — Smelt Hill Dam removal fact sheet", "https://www.nae.usace.army.mil/portals/74/docs/topics/presumpscot/factsheet.pdf"], ["Presumpscot Falls Bridge (coordinates)", "https://en.wikipedia.org/wiki/Presumpscot_Falls_Bridge"]]}], "art": [{"lat": 43.7169, "lon": -70.2645, "title": "Presumpscot Falls", "note": "The falls at the head of tide, painted two decades before Maine’s first hydroelectric plant rose on this very spot.", "coll": "Maine Historical Society", "link": "https://www.mainememory.net/record/6958", "approx": false, "cat": "art", "who": "John Bradley Hudson Jr.", "date": "1867", "medium": "oil on canvas"}, {"lat": 43.679, "lon": -70.3692, "title": "Lower Falls at Saccarappa Dam", "note": "The falls that powered Westbrook’s mills, caught mid-construction.", "coll": "City of Portland", "link": "https://www.mainememory.net/record/148232", "approx": false, "cat": "art", "who": "William S. Edwards", "date": "1887", "medium": "photograph"}, {"lat": 43.6818, "lon": -70.3662, "title": "Presumpscot River, Westbrook", "note": "“General view of Presumpscot River, Westbrook.” The Bridge Street bridge — one of Westbrook’s three river crossings.", "coll": "Boston Public Library", "link": "https://www.mainememory.net/record/71867", "approx": false, "cat": "art", "who": "Tichnor Bros.", "date": "ca. 1938", "medium": "linen postcard"}, {"lat": 43.6844, "lon": -70.3536, "title": "Saccarappa & Cumberland Mills panorama", "note": "A bird’s-eye view north over Westbrook, drawn around the river and the Cumberland & Oxford Canal.", "coll": "Maine Historical Society", "link": "https://www.mainememory.net/record/13134", "approx": false, "cat": "art", "who": "Beck & Pauli / J. J. Stoner", "date": "1879", "medium": "bird’s-eye lithograph"}, {"lat": 43.7556, "lon": -70.4386, "title": "Gambo Dam, Oriental Powder Mills", "note": "The powder-mill dam at Gambo Falls, on the Gorham–Windham line.", "coll": "Maine Historical Society", "link": "https://www.mainememory.net/record/99132", "approx": true, "cat": "art", "who": "Nathan Goold", "date": "ca. 1900", "medium": "photograph"}, {"lat": 43.712, "lon": -70.315, "title": "Pride’s Bridge, Presumpscot River", "note": "A leading 19th-century Portland landscape painter’s view of Pride’s Bridge, on the lower river between Westbrook and Falmouth.", "coll": "Bowdoin College Museum of Art", "link": "https://en.wikipedia.org/wiki/Harrison_Bird_Brown", "approx": true, "cat": "art", "who": "Harrison Bird Brown", "date": "1865", "medium": "oil on canvas"}, {"lat": 43.7205, "lon": -70.25, "title": "Presumpscot River Basin from Scitterugusset Creek", "note": "A detailed panoramic view of the river basin, drawn from the Falmouth estuary.", "coll": "via Mainely Frames & Gallery", "link": null, "approx": true, "cat": "art", "who": "William C. Harrison", "date": "2001", "medium": "pen-and-ink lithograph"}, {"lat": 43.682, "lon": -70.36, "title": "Chief Polin and the 1739 record", "note": "In August 1739 the Wabanaki leader Polin travelled to Boston. The colonial minutes record him telling Governor Belcher that the dams had barred \"the fish… which is our food,\" on a river the clerk wrote down as \"the River, which I belong too\" (often modernized as \"the river to which I belong\"). The minutes say \"the fish,\" not salmon. When no lasting passage was made, the mills at Saccarappa and Presumpscot Falls were burned in 1744; Polin was killed in 1756. Fish passage was one thread in a larger struggle over land, food and sovereignty — see the Fish passage tab.", "coll": "Friends of Casco Bay; Brooks & Brooks (2010); PRW Guide (1994)", "link": "https://www.cascobay.org/the-river-to-which-we-belong/", "approx": false, "cat": "words", "who": "Wabanaki (Presumpscot band)", "date": "1739–1756", "medium": "history"}, {"lat": 43.6842, "lon": -70.3548, "title": "Chief Polin Memorial", "note": "Unveiled in 2018 on the back edge of the Farm at Conant Homestead, off Conant Street in Westbrook — near the falls where Polin’s people fished and farmed. A large inscribed stone bearing his name stands with four granite slabs for the Wabanaki tribes of Maine and interpretive boards on Polin and the river. The Friends of the Presumpscot River raised it, led by the sculptor Michael Shaughnessy; it is reached by the Conant Trail.", "coll": "Portland Press Herald; Friends of the Presumpscot River", "link": "https://www.pressherald.com/2018/09/30/after-more-than-250-years-chief-polin-gets-his-due/", "approx": true, "cat": "words", "who": "Friends of the Presumpscot River; Michael Shaughnessy", "date": "2018", "medium": "stone memorial"}, {"lat": 43.687, "lon": -70.351, "title": "“The fairest river in Maine”", "note": "Around 1900 pleasure steamers — the Louise and the Santa Maria — carried up to 200 passengers a day on the lower river, and a poem printed on the company’s timetables called the Presumpscot “the fairest river in Maine.”", "coll": "PRW Guide (1994)", "link": null, "approx": false, "cat": "words", "who": "Presumpscot Steamboat Co. timetable", "date": "ca. 1900", "medium": "verse"}, {"lat": 43.676, "lon": -70.344, "title": "River Voices: Perspectives on the Presumpscot", "note": "A multidisciplinary celebration of the whole river — geology to Wabanaki history to the fight for fish passage — with original and historical artwork throughout.", "coll": "North Country Press", "link": "https://www.northcountrypress.com/river-voices-perspectives-on-the-presumpscot.html", "approx": false, "cat": "words", "who": "Sanford, Plumley & Shaughnessy (eds.)", "date": "book", "medium": "essays & art"}, {"lat": 43.793, "lon": -70.446, "title": "Guide to the Presumpscot River", "note": "The source-to-sea guide — history, ecology, and paddling — that anchors much of what’s on this map.", "coll": "PRW", "link": null, "approx": true, "cat": "words", "who": "Presumpscot River Watch", "date": "1994", "medium": "book · history, ecology & recreation"}, {"lat": 43.7198, "lon": -70.2722, "title": "Sounds of Maine — Presumpscot River Preserve", "note": "A recorded soundscape of the river in early fall — birdsong, falling leaves, moving water.", "coll": "soundsofmaine.life", "link": "https://soundsofmaine.life/presumpscot-river-preserve/", "approx": false, "cat": "words", "who": "David Bruggink", "date": "2020", "medium": "field soundscape"}, {"lat": 43.704, "lon": -70.377, "title": "Alewife migration at Mill Brook Preserve", "note": "Each spring, tens of thousands of alewives (about 70,000 made the run in 2019) climb roughly 11 miles from Casco Bay up the Presumpscot and Mill Brook to spawn in Highland Lake, where the state began stocking them in 1987 and the first real returns came back in 1991. They mass at the foot of the falls here, resting before the climb; two viewing pools sit on the trails, and at the more remote northern pool you can watch several fish ascend the waterfall at once. These photos were taken during the run at the end of May 2026 — in the first, the amber pool is solid with alewives. (Tap a photo to enlarge.)", "coll": "Photographs: Antonia Sohns, 2026 · Presumpscot Regional Land Trust", "link": "https://www.prlt.org/alewife-migration", "approx": true, "cat": "living", "who": "river herring → Highland Lake", "date": "late May–early June", "medium": "ecological event"}, {"lat": 43.692, "lon": -70.247, "title": "Summer bluefish at the river mouth", "note": "In summer, schools of bluefish move into the Presumpscot where it enters Casco Bay, chasing menhaden — pogies — and other baitfish. When the blues are in, the striped bass leave. You can watch it from the Martin’s Point (Rte 1) and I-295 bridges in Falmouth: the water boils with baitfish breaking the surface, and the dark dorsal fins and forked tails of the bluefish cut through as they feed.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "cat": "living", "who": "bluefish · menhaden (pogies) · striped bass", "date": "July–August", "medium": "seasonal event"}, {"lat": 43.68, "lon": -70.366, "title": "“Old horse, old horse” — the board-hauler’s rhyme", "note": "Boards sawn at Saccarappa were floated downstream or carted by horse to Portland. The teamsters left a rhyme behind: “Old horse, old horse, what brought you here? / From Saccarap to Portland Pier / I’ve carted boards this many a year.”", "coll": "PRW Guide (1994)", "link": null, "approx": true, "cat": "words", "who": "Saccarappa millworkers’ verse", "date": "1700s–1800s", "medium": "work rhyme"}, {"lat": 43.715, "lon": -70.266, "title": "The “Smelt King” of Smelt Hill", "note": "Before the runs collapsed, people gathered each spring at Presumpscot Falls to net the migrating fish. Samuel Knight, the “Smelt King,” is said to have caught more than a million and a half smelts in his lifetime, with single hauls of 400 pounds of smelts and 600 pounds of eels; in 1864 one dipnetter reportedly took 20,000 alewives here.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "cat": "words", "who": "Samuel Knight; the Presumpscot Falls fishery", "date": "1800s", "medium": "river history"}, {"lat": 43.7185, "lon": -70.238, "title": "The Presumpscot estuary at Gilsland Farm", "note": "At Maine Audubon’s Gilsland Farm in Falmouth, the trails open onto the Presumpscot’s tidal delta — salt-marsh cordgrass and mudflats at low water, looking across the estuary toward the river’s channel (not out to Casco Bay). Herons and egrets stalk the mudflats; ospreys dive offshore. (Tap a photo to enlarge.)", "coll": "Photographs: Antonia Sohns, 2026 · Maine Audubon, Gilsland Farm", "link": "https://maineaudubon.org/visit/gilsland-farm/", "approx": true, "cat": "living", "who": "salt marsh · herons, ospreys, eagles", "date": "June", "medium": "place & ecology"}, {"lat": 43.7169, "lon": -70.2648, "title": "Presumpscot Falls Park & the grist-mill stones", "note": "At the Lower Falls, John Phillips built a gristmill in 1657 — the first in the region, and (the marker notes) the second or third in the Province of Maine — on land he bought from George Cleeves, founder of the settlement that was called Machigonne, then Casco, then Falmouth, and today Portland. Families brought their corn here by boat or trail to be ground. A second gristmill followed at these falls in 1735 (Samuel Waldo and Thomas Westbrook). The two granite millstones on the overlook were unearthed in the 1890s during S.D. Warren’s hydro construction, set into the dam as decoration, and salvaged by Howard Reiche when the dam came out in 2002. (Tap a photo to enlarge; the last image is the park’s marker.)", "coll": "Photographs: Antonia Sohns, 2026 · Portland Press Herald; PRW Guide (1994)", "link": "https://www.pressherald.com/2017/08/09/falmouths-historic-gristmills-recalled-at-presumpscot-falls-park/", "approx": true, "cat": "living", "who": "John Phillips grist mill · Falmouth side", "date": "1657", "medium": "place & history"}, {"lat": 43.718, "lon": -70.2695, "title": "Pine bluffs near Presumpscot Falls", "note": "On the Falmouth side, a little upstream of the falls and near the gristmill overlook and the arched Presumpscot Falls Bridge, steep bluffs of white pine and hemlock drop to the green, still water at the head of tide. A quiet stretch a few minutes from the city. (Tap a photo to enlarge.)", "coll": "Photographs: Antonia Sohns, 2026", "link": null, "approx": true, "cat": "living", "who": "hemlock–white-pine bluffs · Falmouth side", "date": "autumn", "medium": "place & ecology"}], "haz": [{"lat": 43.785, "lon": -70.452, "title": "Anderson Falls dam collapse", "note": "When the dam at Anderson Falls on the Pleasant River collapsed in 1814, the sudden release carried off a sawmill, a grist mill and four bridges on the Pleasant, plus the bridges at Gambo and Mallison Falls on the main stem. A built structure that failed — man-made.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "when": "1814", "cause": "human — dam failure"}, {"lat": 43.7274, "lon": -70.42, "title": "The great flood of 1843", "note": "One of the two great historic floods on the river — a natural high-water event (rain and snowmelt). It swept away temporary bridges and roads; at Cumberland Mills it \"ran its course, untrammeled, to the sea.\" The flood itself was natural, though the damage fell hardest on the mills and dams crowding the river.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "when": "1843", "cause": "natural flood"}, {"lat": 43.8, "lon": -70.46, "title": "Pope Falls dam failure", "note": "A poorly built mill dam at the outlet of Little Sebago Lake failed in 1861; the flood swept away the Popes’ saw, woolen and grist mills and every bridge from Ditch Brook down to Mallison Falls. A man-made structure, built against warnings, that gave way.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "when": "1861", "cause": "human — dam failure"}, {"lat": 43.6855, "lon": -70.347, "title": "Great Cumberland Mills Mud Slide", "note": "About 25–30 acres of clay bank a third of a mile below Cumberland Mills slid into the river, stopping the flow for 8–9 hours, filling the bed for half a mile and moving the channel roughly 300 feet. It dammed the river some 15 feet deep and shut all fifteen mills for weeks. The record describes it as rain-triggered and natural, in the same soft marine clay that has shifted this channel before (1831, 1851) — though that clay can also fail under human loading, as it did in 2020.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "when": "22 Nov 1868", "cause": "natural landslide"}, {"lat": 43.6795, "lon": -70.369, "title": "The flood of 1896", "note": "The 1896 flood — another natural high-water event — closed the Westbrook Manufacturing Company’s sailcloth mill at Saccarappa for good; it was never reopened. With 1843, one of the two floods that reshaped the working river.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "when": "1896", "cause": "natural flood"}, {"lat": 43.7105, "lon": -70.262, "title": "Dioxin and the closed flats", "note": "The estuary’s shellfish flats have been closed since 1946. Paper-bleaching left dioxin in fish and lobster; advisories against eating fish below Westbrook ran through the late 1980s and were lifted in 1992 as levels fell. Entirely man-made, and some of it settled into the mud and lingered long after the discharge stopped.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "when": "1946–1990s", "cause": "human — industrial pollution"}, {"lat": 43.6844, "lon": -70.3536, "title": "\"A foot deep in foam\" — the river’s collapse", "note": "By 1965 the lower Presumpscot was, in the state’s own words, dead: no measurable oxygen at Presumpscot Falls, and S.D. Warren alone discharging about 52,800 pounds of waste a day. Locals called it a \"root beer float\"; the fumes blackened house paint. Wholly man-made — and the Clean Water Act (1972) and new treatment plants began to reverse it.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "when": "1960s–1970s", "cause": "human — industrial pollution"}, {"lat": 43.6815, "lon": -70.345, "title": "Combined sewer overflows", "note": "When heavy rain overwhelms Portland’s and Westbrook’s combined sewers, stormwater and raw sewage overflow together into the river. After Hurricane Bob in August 1991, bacteria below Westbrook’s treatment plant spiked to nearly 27,900 colonies — about thirty times the state limit. The rain is natural; the overflow is a human infrastructure problem.", "coll": "PRW Guide (1994)", "link": null, "approx": true, "when": "1991 · ongoing risk", "cause": "human — sewer overflows"}, {"lat": 43.6875, "lon": -70.3338, "title": "Warren Avenue landslide", "note": "A clay bank behind a fill yard at 161 Warren Avenue in Westbrook, just downstream of the Sappi mill, gave way and briefly dammed the whole river; a breach opened by mid-afternoon and the mayor declared a state of emergency. The clay is the Presumpscot Formation — the same layer that failed in 1868 — and geologists identified the weight of fill loaded on top as the trigger.", "coll": "Portland Press Herald · Maine Geological Survey", "link": "https://www.pressherald.com/2020/09/16/landslide-blocks-presumpscot-river-in-westbrook/", "approx": false, "when": "16 Sept 2020", "cause": "human-triggered landslide"}, {"lat": 43.677, "lon": -70.352, "title": "December 2023 storm & flood", "note": "The storm of 18–21 December 2023 dropped 4–8 inches of rain on melting snow and pushed rivers across Maine to record levels — several past the April 1987 benchmark. The Presumpscot rose sharply at the Westbrook gauge, and more storms followed in January 2024. The storm was natural, but storms this intense are made more likely by a warming climate — which is why the watershed’s towns are planning for bigger floods.", "coll": "USGS", "link": "https://www.usgs.gov/centers/new-england-water-science-center/science/december-2023-flood-maine", "approx": true, "when": "18–21 Dec 2023", "cause": "natural storm (climate-amplified)"}], "ben": [{"lat": 43.805, "lon": -70.435, "title": "Windham — Resource Protection", "note": "The Casco Bay Estuary Partnership reports that Resource Protection districts cover about 40% of Windham’s Presumpscot shoreline — land kept in a natural state because it includes 100-year floodplain, wetlands or steep slopes.", "coll": "Casco Bay Estuary Partnership", "link": "https://cascobayestuary.org/wp-content/uploads/2018/02/Presumpscot-River-Background.pdf", "approx": true, "cat": "zone", "who": "shoreland zoning", "medium": "floodplain & wetland protection"}, {"lat": 43.745, "lon": -70.425, "title": "Gorham — Resource Protection", "note": "More than 60% of Gorham’s Presumpscot shoreline lies in Resource Protection zoning, per the Casco Bay Estuary Partnership — among the highest shares on the river.", "coll": "Casco Bay Estuary Partnership", "link": "https://cascobayestuary.org/wp-content/uploads/2018/02/Presumpscot-River-Background.pdf", "approx": true, "cat": "zone", "who": "shoreland zoning", "medium": "floodplain & wetland protection"}, {"lat": 43.6835, "lon": -70.356, "title": "Westbrook — Resource Protection", "note": "Over 60% of Westbrook’s shoreline is in Resource Protection districts — floodplain, wetland and steep-slope land where building is limited to protect the river’s natural capacity to absorb high water.", "coll": "Casco Bay Estuary Partnership", "link": "https://cascobayestuary.org/wp-content/uploads/2018/02/Presumpscot-River-Background.pdf", "approx": true, "cat": "zone", "who": "shoreland zoning", "medium": "floodplain & wetland protection"}, {"lat": 43.7175, "lon": -70.266, "title": "Falmouth — Resource Protection", "note": "More than 60% of Falmouth’s lower-river shoreline is in Resource Protection zoning, including the tidal marshes and clay bluffs near Presumpscot Falls.", "coll": "Casco Bay Estuary Partnership", "link": "https://cascobayestuary.org/wp-content/uploads/2018/02/Presumpscot-River-Background.pdf", "approx": true, "cat": "zone", "who": "shoreland zoning", "medium": "floodplain & wetland protection"}, {"lat": 43.702, "lon": -70.287, "title": "Portland — Resource Protection", "note": "About 40% of Portland’s Presumpscot shoreline is in Resource Protection zoning, along the estuary and the river’s lowest reach.", "coll": "Casco Bay Estuary Partnership", "link": "https://cascobayestuary.org/wp-content/uploads/2018/02/Presumpscot-River-Background.pdf", "approx": true, "cat": "zone", "who": "shoreland zoning", "medium": "floodplain & wetland protection"}, {"lat": 43.6875, "lon": -70.342, "title": "Rivermeadow Nature Preserve", "note": "A 44-acre preserve in Westbrook — including 30 acres of forested wetlands and 3,300 feet of Presumpscot shoreline — that soaks up local runoff and gives migratory birds, pollinators and amphibians habitat close to the city.", "coll": "Presumpscot Regional Land Trust", "link": "https://www.prlt.org/rivermeadow-nature-preserve", "approx": true, "cat": "cons", "who": "Presumpscot Regional Land Trust · Westbrook", "medium": "44 acres · 3,300 ft of shoreline"}, {"lat": 43.699, "lon": -70.305, "title": "Aquifer-recharge corridor", "note": "Portland’s planning records map broad aquifer-recharge areas along the Presumpscot, including a corridor between Rankin Street and the Maine Turnpike — where permeable ground lets river and groundwater exchange. USGS studies show the two systems are closely linked in southern Maine.", "coll": "City of Portland natural- & water-resources documents", "link": null, "approx": true, "cat": "rech", "who": "City of Portland planning records", "medium": "river ↔ groundwater"}, {"lat": 43.695, "lon": -70.323, "title": "Lower-Presumpscot flood study", "note": "A University of Maine / Nature Conservancy project used the lower Presumpscot as a study area to quantify how much natural infrastructure — forest cover, watershed and floodplain storage, soils, channel networks — softens flood peaks, with a retrospective analysis of past storms on the lower Presumpscot.", "coll": "UMaine Mitchell Center", "link": "https://umaine.edu/mitchellcenter/improved-delineation-natural-infrastructure-capital-improved-strategies-flood-attenuation-support-states-clean-water-maine-bond/", "approx": true, "cat": "flood", "who": "UMaine Mitchell Center · The Nature Conservancy", "medium": "natural-infrastructure flood attenuation"}], "wells": [{"lat": 43.70391, "lon": -70.37746, "town": "WINDHAM", "depth": 146.0, "yield": 75.0, "use": "DOMESTIC", "type": "BEDROCK", "drill": "10/1/1970 "}, {"lat": 43.80673, "lon": -70.44205, "town": "WINDHAM", "depth": 302.0, "yield": 1.25, "use": "DOMESTIC", "type": "BEDROCK", "drill": "6/1/1971 8"}, {"lat": 43.77092, "lon": -70.43977, "town": "WINDHAM", "depth": 72.0, "yield": 8.0, "us const artTag={art:'artwork',words:'words & sound',living:'living river'};
const layerDams=L.layerGroup(DATA.dams.map(f=>marker(f,(f.status==='removed'||f.status==='open')?'#2e7d5b':COLORS.dam).bindPopup(damPopup(f),{maxWidth:330})));
const layerArt =L.layerGroup(DATA.art.map(f=>marker(f,COLORS.art).bindPopup(genPopup(f,COLORS.art,artTag[f.cat]||'art & culture'))));
const layerHaz =L.layerGroup(DATA.haz.map(f=>marker(f,COLORS.haz).bindPopup(genPopup({...f,who:f.when,date:'',medium:f.cause},COLORS.haz,'disaster'))));
const layerBen =L.layerGroup(DATA.ben.map(f=>marker(f,COLORS.ben).bindPopup(genPopup(f,COLORS.ben,'protection'))));
const layerWells=L.layerGroup(DATA.wells.map(f=>marker(f,COLORS.well,4).bindPopup(wellPopup(f))));
layerDams.addTo(map); layerArt.addTo(map); layerHaz.addTo(map); layerBen.addTo(map);

const baseLayers={'Esri Topographic':esriTopo,'Esri Imagery':esriImg,'OpenStreetMap':osm};
const overlays={};
overlays['<span style="color:'+COLORS.dam+'">&#9679;</span> Dams & barriers (this atlas)'] = layerDams;
overlays['<span style="color:'+COLORS.art+'">&#9679;</span> Art & culture'] = layerArt;
overlays['<span style="color:'+COLORS.haz+'">&#9679;</span> Hazards & disasters'] = layerHaz;
overlays['<span style="color:'+COLORS.ben+'">&#9679;</span> Protection & benefits'] = layerBen;
overlays['<span style="color:'+COLORS.well+'">&#9679;</span> Water wells near river (MGS)'] = layerWells;
if(gis.nhd) overlays['— USGS rivers & streams (NHD)'] = gis.nhd;
if(gis.nid) overlays['— Dams in watershed (USACE Inventory)'] = gis.nid;
if(gis.fema) overlays['— FEMA flood hazard zones'] = gis.fema;
if(gis.wet) overlays['— USFWS wetlands (NWI)'] = gis.wet;
if(gis.aquifer) overlays['— Maine sand & gravel aquifers'] = gis.aquifer;
if(gis.wbd) overlays['— USGS watershed boundaries'] = gis.wbd;
L.control.layers(baseLayers, overlays, {collapsed:false, position:'topright'}).addTo(map);
L.control.scale({imperial:true, metric:true}).addTo(map);

const legend=L.control({position:'bottomleft'});
legend.onAdd=function(){const div=L.DomUtil.create('div','legend');
  div.innerHTML='<h4>Points</h4>'+
   '<div class="row"><span class="sw" style="background:'+COLORS.dam+'"></span>Dams &amp; barriers</div>'+
   '<div class="row"><span class="sw" style="background:'+COLORS.art+'"></span>Art &amp; culture</div>'+
   '<div class="row"><span class="sw" style="background:'+COLORS.haz+'"></span>Hazards &amp; disasters</div>'+
   '<div class="row"><span class="sw" style="background:'+COLORS.ben+'"></span>Protection &amp; benefits</div>'+
   '<div class="row"><span class="sw" style="background:'+COLORS.well+'"></span>Water wells (MGS)</div>'+
   '<div class="note">Toggle reference layers (top-right): USGS rivers (on), watershed dams (USACE), FEMA flood zones, USFWS wetlands, Maine aquifers, watershed boundaries. Click any feature for detail and sources.</div>';
  L.DomEvent.disableClickPropagation(div); return div;};
legend.addTo(map);

const all=[].concat(DATA.dams,DATA.art,DATA.haz,DATA.ben).map(f=>[f.lat,f.lon]);
map.fitBounds(L.latLngBounds(all).pad(0.12));
</script>
</body>
</html>
